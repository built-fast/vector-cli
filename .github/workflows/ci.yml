name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --help

      - name: Quality - formatting
        run: make fmt-check

      - name: Quality - go vet
        run: make vet

      - name: Quality - linting
        run: make lint

      - name: Quality - go tidy
        run: make tidy-check

      - name: Regressions - CLI surface changes
        run: make check-surface

      - name: Regressions - AI skill drift
        run: make check-skill-drift

  tests:
    name: Tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Prism
        run: npm install -g @stoplight/prism-cli

      - name: Cache BATS
        id: cache-bats
        uses: actions/cache@v5
        with:
          path: ~/bats-install
          key: bats-1.13.0-${{ runner.os }}

      - name: Install BATS
        if: steps.cache-bats.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh "$HOME/bats-install"

      - name: Add BATS to PATH
        run: echo "$HOME/bats-install/bin" >> "$GITHUB_PATH"

      - name: Tests - go unit tests
        run: make test

      - name: Tests - BATS e2e tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: make test-e2e
