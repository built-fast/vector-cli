version: 2

project_name: vector

builds:
  - main: ./cmd/vector
    binary: vector
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/built-fast/vector-cli/internal/version.Version={{.Version}}
      - -X github.com/built-fast/vector-cli/internal/version.Commit={{.Commit}}
      - -X github.com/built-fast/vector-cli/internal/version.Date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: man/man1/vector.1
        dst: share/man/man1/vector.1

changelog:
  # Use GitHub's auto-generated release notes (categories configured in .github/release.yml)
  use: github-native

release:
  github:
    owner: built-fast
    name: vector-cli
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "{{.ProjectName}} v{{.Version}}"
